:root{color-scheme:light;--ivory:#f6f4ef;--side:#eeebe4;--surface:#fdfcf9;--paper:#f3f0e9;--ink:#262b2f;--muted:#5c6368;--line:#e1ddd4;--blue:#3b5568;--gold:#b86b4b;--a:#3b5568;--b:#b86b4b;--shadow:0 2px 8px #3a2e2808;--night:#2a3d4b;--focus:#8a5a2b;--sans:"Atelier Sans",Arial,sans-serif;--serif:"Atelier Serif",Georgia,serif}
:root[data-theme="dark"]{color-scheme:dark;--ivory:#1b2228;--side:#1f272e;--surface:#252f37;--paper:#2a353e;--ink:#f2efe9;--muted:#bfc4c7;--line:#36424c;--blue:#9cc0d6;--gold:#e0a383;--shadow:0 2px 8px #0003;--focus:#e6c08a}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font:14px/1.55 var(--sans);font-variant-numeric:tabular-nums}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button[disabled]{cursor:not-allowed}h1,h2,h3,p,dl,dd{margin:0}h1,h2{font-family:var(--serif);font-weight:400;line-height:1.13;letter-spacing:-.035em}h1{font-size:clamp(2rem,3.5vw,3.2rem)}h2{font-size:clamp(1.25rem,2.25vw,1.75rem)}p{color:var(--muted)}svg{flex:none}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,g:focus-visible{outline:2px solid var(--focus);outline-offset:3px}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip{position:absolute;z-index:10;top:6px;left:6px;transform:translateY(-200%)}.skip:focus{transform:none}
.layout{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100dvh}.sidebar{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:23px 16px 14px;scrollbar-width:thin}.brand{display:flex;gap:10px;align-items:center;margin:0 3px 21px;padding:0 1px 19px;border-bottom:1px solid var(--line)}.brand-mark{width:43px;height:43px;display:grid;place-items:center;background:var(--night);color:#ebcb91;border-radius:12px;flex:none}.brand-name{font:400 15.6px/1.15 var(--serif);letter-spacing:-.035em;white-space:nowrap}.brand small{display:block;margin-top:4px;font-size:10px;color:var(--muted);letter-spacing:.025em}.sidebar nav section+section{margin-top:13px}.sidebar nav p{padding:0 10px 4px;font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.10em;text-transform:uppercase}.sidebar nav a{display:flex;gap:9px;align-items:center;min-height:32px;border-radius:8px;padding:5px 9px;color:var(--muted);font-size:12px}.sidebar nav a:hover,.sidebar nav a[aria-current="page"]{color:var(--ink);background:var(--surface)}.sidebar nav a[aria-current="page"]{font-weight:700;box-shadow:inset 2px 0 var(--gold)}.local-label{border-top:1px solid var(--line);margin-top:19px;padding:13px 8px 0;color:var(--muted);display:flex;gap:8px;align-items:center;font-size:11px}
.workspace{min-width:0}.topbar{height:65px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:0 clamp(17px,3vw,46px);background:var(--surface);font-size:12px;color:var(--muted)}.breadcrumb,.top-actions{display:flex;align-items:center;gap:10px}.breadcrumb b{color:var(--ink)}.sample{padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--gold) 23%,var(--surface));color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.035em}.device-status{display:flex;gap:6px;align-items:center}.nav-mask,#mobile-toggle{display:none}.save-warning{margin:12px auto 0;max-width:1080px;padding:12px 18px;background:#e9cc97;color:#322619;border-radius:10px}
.content{max-width:1420px;margin:0 auto;padding:29px clamp(16px,3vw,46px) 45px;outline:none}.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 0 22px}.page-heading p{margin-top:7px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.button,.plain{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;min-height:37px;font-size:12px;font-weight:700;white-space:nowrap}.button:hover{background:var(--paper);border-color:var(--gold)}.button.primary{background:#3b5568;border-color:#3b5568;color:#fffdf8}.button.primary:hover{background:#263e4a}.plain{background:transparent;border:0}.square{height:34px;width:34px;min-height:34px;padding:0;border-radius:8px}.square:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}.text-link{font-size:12px;color:var(--blue);font-weight:700;display:inline-flex;gap:6px;align-items:center}.text-link:hover{text-decoration:underline;text-underline-offset:3px}

:root{--bg0:#07090C;--bg1:#0B1016;--bg2:#142838;--card:#0E1822;--card2:#121F2B;--acc:#D4AF6A;--acc2:#6FC2A0}
/* ===== Atelier luxury dark theme ===== */
:root,:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:dark;
  --ivory:var(--bg0);--side:var(--bg1);--surface:var(--card);--paper:color-mix(in srgb,var(--card2) 70%,#000 0%);--ink:#F4F0E8;--muted:#9AA3AE;--line:rgba(244,240,232,.08);
  --blue:var(--acc);--gold:var(--acc2);--a:#E8E2D6;--b:var(--acc2);--night:var(--bg0);--focus:var(--acc);--shadow:0 18px 40px -24px rgba(0,0,0,.85);
  --sans:"Lux Sans","Inter","Segoe UI",Arial,sans-serif;--serif:"Lux Serif","Baskerville",Georgia,serif;
  --accsoft:color-mix(in srgb,var(--acc) 16%,transparent);--accline:color-mix(in srgb,var(--acc) 30%,transparent)}
body{background:var(--bg0);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 60%),radial-gradient(900px 700px at 8% 110%,color-mix(in srgb,var(--bg2) 70%,transparent),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0))}
p{color:var(--muted)}
h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:.005em}
/* sidebar */
.sidebar{background:linear-gradient(180deg,color-mix(in srgb,var(--bg0) 80%,#000),var(--bg1));border-right:1px solid var(--accline)}
.brand{border-bottom:1px solid var(--line)}
.brand-mark{background:transparent!important;border:1px solid var(--accline);border-radius:12px}
.brand-name{font-family:var(--serif);font-size:17px;color:var(--ink)}
.brand small{color:var(--acc);text-transform:uppercase;letter-spacing:.22em;font-size:8.5px}
.sidebar nav p{color:#667080;letter-spacing:.22em;font-size:9px;font-weight:600}
.sidebar nav a{color:#C9CED4;font-size:13px;border:1px solid transparent}
.sidebar nav a svg{opacity:.75}
.sidebar nav a:hover{background:rgba(255,255,255,.03);color:var(--ink)}
.sidebar nav a[aria-current="page"]{background:linear-gradient(90deg,var(--accsoft),transparent);border-color:var(--accline);box-shadow:none;color:var(--ink);font-weight:600}
.sidebar nav a[aria-current="page"] svg{color:var(--acc);opacity:1}
.local-label{border-top:1px solid var(--line);color:var(--muted)}
/* top */
.topbar{background:transparent;border-bottom:1px solid var(--line);color:var(--muted)}
.breadcrumb b{color:var(--ink)}
.sample{background:var(--acc);color:#0A0E14;letter-spacing:.14em;font-weight:700}
#atelier-cloud-open{background:transparent!important;color:var(--ink)!important;border:1px solid var(--accline)!important;border-radius:9px!important;font-size:12.5px}
#atelier-cloud-open:hover{background:var(--accsoft)!important}
/* headings */
.page-heading{border-bottom:1px solid var(--accline);padding-bottom:16px}
.page-heading h1{font-size:clamp(2rem,3.3vw,2.9rem);color:var(--ink)}
.page-heading p{color:var(--muted)}
/* buttons */
.button,.plain{background:transparent;border:1px solid var(--accline);color:var(--ink);font-weight:600;border-radius:9px}
.button:hover{background:var(--accsoft);border-color:var(--acc)}
.button.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));border-color:var(--acc);color:#0A0E14}
.button.primary:hover{filter:brightness(1.07);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc))}
.plain{border-color:transparent}.square:hover{background:var(--accsoft)}
.text-link{color:var(--acc)}
/* hero */
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--card2) 90%,var(--acc) 10%),var(--card));border:1px solid var(--accline);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 30px 60px -30px rgba(0,0,0,.9);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--acc),transparent)}
.hero h2{font-family:var(--sans);font-weight:300;letter-spacing:-.015em;font-size:clamp(2rem,3.6vw,3.1rem);color:var(--ink)}
.hero p{color:#C7C2B8}.hero .text-link{color:var(--acc)}
.eyeline{color:var(--acc);letter-spacing:.24em;font-weight:600}
.eyeline i{background:var(--acc)!important}
.hero-grid a{background:rgba(255,255,255,.025);border:1px solid var(--line)}
.hero-grid a:hover{border-color:var(--accline);background:var(--accsoft)}
.hero-grid span{color:var(--acc);letter-spacing:.18em;opacity:1}
.hero-grid strong{font-family:var(--sans);font-weight:300;letter-spacing:-.01em}
/* stats */
.stat,.panel{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid color-mix(in srgb,var(--acc) 14%,transparent);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,var(--shadow)}
.stat{border-top:1px solid color-mix(in srgb,var(--acc) 14%,transparent);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--tone,var(--acc)),color-mix(in srgb,var(--acc) 12%,transparent))}
.stat:hover{border-color:var(--accline);transform:translateY(-1px)}
.stat-label{color:var(--acc);letter-spacing:.18em;text-transform:uppercase;font-size:9.5px;font-weight:600}
.stat-label svg{color:var(--acc)}
.stat strong{font-weight:300;font-size:clamp(1.4rem,2.6vw,2.15rem);letter-spacing:-.01em;color:var(--ink)}
.stat small{color:var(--muted)}
.stat.tone-alert{--tone:#D0676C}.stat.tone-alert strong{color:#E79A9E}.stat.tone-warn{--tone:#D9B36C}
.panel-heading h2{font-size:1.45rem;color:var(--ink)}
.panel-heading p{color:var(--muted)}
/* lists, tables */
.reminder-row,.event-row{border-top:1px solid var(--line);color:var(--ink)}
.reminder-row:hover,.event-row:hover{color:var(--acc)}
.reminder-row small{color:var(--muted)}
.reminder-dot{background:var(--acc)!important;box-shadow:0 0 8px color-mix(in srgb,var(--acc) 60%,transparent)}
.records th,.report-table th{color:var(--acc);letter-spacing:.16em;text-transform:uppercase;font-size:9.5px;font-weight:600;background:transparent}
.records td,.report-table td,.report-table th[scope=row]{border-color:var(--line)}
.records tr:hover td{background:rgba(255,255,255,.02)}
.report-table th[scope=row]{color:var(--ink);letter-spacing:0;text-transform:none;font-size:12.5px}
table{color:var(--ink)}
.status{background:rgba(255,255,255,.06);color:var(--ink);letter-spacing:.04em}
.status.good{background:rgba(95,168,138,.16);color:#8FD1B3}
.status.warn{background:rgba(217,179,108,.16);color:#E6C88E}
.status.alert{background:rgba(208,103,108,.18);color:#F0B0B3}
.parent-chip{background:color-mix(in srgb,var(--tone,var(--acc)) 18%,transparent);color:var(--ink)}
.empty{color:var(--muted)}
.register-summary b,.summary-totals dd{color:var(--acc)}
.table-tools .search-box{border-color:var(--line);background:rgba(255,255,255,.02)}
select,input,textarea{color-scheme:dark}
.form-field input,.form-field textarea,.form-field select,.year-picker select,.sort-label select{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--ink)}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--acc);outline:none}
.form-field span{color:#C9CED4;font-weight:600}
.calculated div,.summary-totals div{background:rgba(255,255,255,.035);border:1px solid var(--line)}
.calculated dt{color:var(--acc);letter-spacing:.12em;text-transform:uppercase}
.calculated dd{font-weight:300;font-size:1.25rem}
.chart text{fill:#7E8794}.chart .grid-line{stroke:rgba(244,240,232,.07)}
.legend .key{color:var(--muted)}
.meter{background:rgba(255,255,255,.06)}.meter i{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 60%,transparent),var(--acc))}.meter.alert i{background:#D0676C}
.cat-row b{color:var(--ink);font-weight:600}
/* dialogs */
dialog{background:linear-gradient(180deg,var(--card2),var(--card));color:var(--ink);border:1px solid var(--accline);box-shadow:0 30px 90px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(3,5,8,.72);backdrop-filter:blur(3px)}
.modal-header h2{color:var(--ink)}
.welcome-choices button{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--ink)}
.welcome-choices button:hover,.welcome-choices button:focus-visible{border-color:var(--acc);background:var(--accsoft)}
.welcome-choices svg{color:var(--acc)}
.welcome-choices small{color:var(--muted)}
#atelier-cloud-panel{background:linear-gradient(180deg,var(--card2),var(--card))!important;color:var(--ink)!important;border:1px solid var(--accline)!important;font-family:var(--sans)}
#atelier-cloud-panel h2{font-family:var(--serif);font-weight:400}
#atelier-cloud-panel input{background:rgba(255,255,255,.04)!important;color:var(--ink)!important;border:1px solid var(--line)!important}
#atelier-cloud-panel button{background:transparent!important;color:var(--ink)!important;border:1px solid var(--accline)!important}
#atelier-cloud-panel button:hover{background:var(--accsoft)!important}
#atelier-cloud-panel button[value=register],#atelier-cloud-panel #atelier-open-own,#atelier-cloud-panel #atelier-join button{background:var(--acc)!important;color:#0A0E14!important;border-color:var(--acc)!important;font-weight:600}
#atelier-cloud-panel [role=status]{color:var(--acc)}
#atelier-cloud-panel p,#atelier-cloud-panel label{color:#C9CED4}
.toast{background:var(--card2);border:1px solid var(--accline);color:var(--ink)}
.save-warning{background:#5a4320;color:#F4F0E8}
.faq details+details{border-top:1px solid var(--line)}.faq summary{color:var(--ink)}
.callout.warn-box{border-left:3px solid var(--acc)}
/* product extras */
.table-card h2{color:var(--ink)}
.seat-list button{color:#D7D2C8}.seat-list button:hover{background:var(--accsoft)}
.big{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--ink)}
.big:hover{border-color:var(--kid,var(--acc));background:var(--accsoft)}
.big.running{background:color-mix(in srgb,var(--kid,var(--acc)) 20%,transparent)}
.since a{background:rgba(255,255,255,.03);border:1px solid var(--line)}
.since span{color:var(--acc);letter-spacing:.14em}
.child-card{border-top:2px solid var(--kid,var(--acc))}
.check-toggle span{color:var(--muted)}
.nav-mask{background:rgba(3,5,8,.7)}
@media(max-width:780px){.topbar{background:color-mix(in srgb,var(--bg0) 92%,transparent);backdrop-filter:blur(8px)}.sidebar{background:var(--bg1)}}
@media print{body::before{display:none}:root,:root[data-theme="dark"],:root[data-theme="light"]{--surface:#fff;--ivory:#fff;--ink:#14181d;--muted:#4a525c;--line:#dcd7cb;--card:#fff;--card2:#fff;--bg0:#fff;--bg1:#fff}body{background:#fff;color:#14181d}.stat,.panel,.hero{background:#fff!important;box-shadow:none;border-color:#ddd}.hero h2,.hero p,.page-heading h1,.panel-heading h2{color:#14181d}}

function lineChart(values,labels,{height=210,fmt=v=>fmtNum(v,0),color='var(--acc)',every=1}={}){

  const grid=[0,.5,1].map(k=>{const v=lo+(hi-lo)*k;return '<line class="grid-line" x1="'+(x0-6)+'" x2="'+(W-4)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(x0-10)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+esc(fmt(v))+'</text>';}).join('');
  const lab=labels.map((l,i)=>i%every===0?'<text x="'+X(i)+'" y="'+(base+18)+'" text-anchor="middle">'+esc(l)+'</text>':'').join('');

}
function stats_(list){

function parseField(v,f){

  if(f.type==='m'||f.type==='f'||f.type==='n'||f.type==='i'){
    const n=Number(v);
    if(!Number.isFinite(n)||Math.abs(n)>99999999||(f.type==='f'&&(n<0||n>1))||(f.type==='i'&&(!Number.isInteger(n)||n<0)))throw Error('Check '+f.label+'.');

  if(typeof v!=='string')throw Error('Check '+f.label+'.');
  if(v.length>2000)throw Error(f.label+' is too long.');
  if(f.type==='d'||f.type==='t'){
    const re=f.type==='d'?/^\d{4}-\d\d-\d\d$/:/^\d{4}-\d\d-\d\dT(?:[01]\d|2[0-3]):[0-5]\d$/;
    if(!re.test(v)||!Number.isFinite(asUTC(v))||keyOf(asUTC(v))!==v.slice(0,10)||v<'2000-01-01'||v>='2101-01-01')throw Error('Check '+f.label+'.');

function normalise(input){

  const clean=emptyRows();
  for(const [name,list] of Object.entries(clean)){
    const seen=new Set();
    const src=input.rows[name]??[];
    if(!Array.isArray(src))throw Error('A register is missing from the backup.');
    for(const r of src){
      if(!r||typeof r.id!=='string'||seen.has(r.id)||!Array.isArray(r.values))throw Error('A record in '+name+' is invalid.');
      seen.add(r.id);
      list.push({id:r.id,values:fields[name].filter(f=>f.type!=='=').map(f=>parseField(r.values[f.i],f))});
    }
  }
  const out={schema:1,edition:input.edition==='SAMPLE'?'SAMPLE':'BLANK',settings:s,rows:clean};
  if(P.tombstones){
    const now=Date.now(),del={};
    for(const [k,t] of Object.entries(input.deleted??{}))if(typeof k==='string'&&k.length<40&&Number.isFinite(t)&&now-t<120*DAY)del[k]=t;
    out.deleted=del;

    if(out.archivedBefore)for(const n of Object.keys(clean))out.rows[n]=clean[n].filter(r=>!P.rowDate||!(P.rowDate(n,r.values)<out.archivedBefore));

}

  const body=list.map(r=>{
    const cells=selected.map(i=>{
      const f=fields[n][i];
      const inner=toggle&&f.label===toggle.label&&!readOnly?'<label class="check-toggle"><input type="checkbox" data-toggle="'+esc(r.id)+'" aria-label="'+esc(toggle.label)+'" '+(r.values[i]==='Yes'?'checked':'')+'><span>'+esc(r.values[i]==='Yes'?toggle.on:toggle.off)+'</span></label>':displayValue(n,f,r.values[i]);
      return '<td data-label="'+esc(f.label)+'">'+inner+'</td>';
    }).join('');
    return '<tr>'+cells+(readOnly?'':'<td class="row-actions"><button type="button" class="plain square" data-action="edit-row" data-name="'+esc(n)+'" data-id="'+esc(r.id)+'" aria-label="Edit record">'+icon('edit',17)+'</button><button type="button" class="plain square" data-action="delete-row" data-name="'+esc(n)+'" data-id="'+esc(r.id)+'" aria-label="Delete record">'+icon('trash',17)+'</button></td>')+'</tr>';
  }).join('');
  return '<div class="table-scroll"><table class="records"><thead><tr>'+head+(readOnly?'':'<th scope="col"><span class="sr">Actions</span></th>')+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function matchingRows(n){
  const search=filter.trim().toLowerCase(), d=P.dateField?.[n]!==undefined?col(n,P.dateField[n]):-1, title=col(n,P.mainField[n]);
  const list=snapshot.rows[n].filter(r=>!search||r.values.some(v=>filled(v)&&String(v).toLowerCase().includes(search))||
    fields[n].some(f=>(f.type==='p'||f.type==='q')&&r.values[f.i]&&String(nameOf(r.values[f.i])).toLowerCase().includes(search)));
  const compare=(a,b,i)=>String(a.values[i]??'').localeCompare(String(b.values[i]??''),undefined,{numeric:true});
  if(order==='name')return list.sort((a,b)=>compare(a,b,title));
  if(d<0)return order==='oldest'?list:list.reverse();
  return list.sort((a,b)=>order==='oldest'?compare(a,b,d):compare(b,a,d));
}
function refreshRegister(n){
  const list=matchingRows(n);
  document.querySelector('#register-count').textContent=list.length+' of '+snapshot.rows[n].length+' records';
  document.querySelector('#register-results').innerHTML=list.length?table(n,list):empty(filter?'No records match your search.':'No records yet.',filter?'':button('Add first record','new-row',{icon:'plus'}));
}
function register(n){
  const list=matchingRows(n);
  const summary=P.summary?.(n)??'';
  const hasDate=P.dateField?.[n]!==undefined;
  return heading(P.titles?.[n]??n,SPECS[n][0],button('Add record','new-row',{primary:true,icon:'plus'}))+(P.above?.(n)??'')+
    '<section class="panel register-panel"><div class="table-tools"><label class="search-box">'+icon('search',18)+'<input id="register-search" type="search" aria-label="Search records" placeholder="Search records" value="'+esc(filter)+'"></label>'+
    '<label class="sort-label"><span>Sort</span><select id="register-sort"><option value="latest" '+(order==='latest'?'selected':'')+'>'+(hasDate?'Newest first':'Last added first')+'</option><option value="oldest" '+(order==='oldest'?'selected':'')+'>'+(hasDate?'Oldest first':'First added first')+'</option><option value="name" '+(order==='name'?'selected':'')+'>'+esc(P.mainField[n])+' A–Z</option></select></label><div class="actions">'+button('Export CSV','export-csv',{icon:'download'})+button('Import CSV','import-csv')+'</div></div>'+
    '<div class="register-meta"><span id="register-count">'+list.length+' of '+snapshot.rows[n].length+' records</span>'+summary+'</div><div id="register-results">'+(list.length?table(n,list):empty(filter?'No records match your search.':'No records yet.',filter?'':button('Add first record','new-row',{icon:'plus'})))+'</div></section>';
}
function field(label,name,value,type='text',attrs=''){return '<label class="form-field"><span>'+esc(label)+'</span><input name="'+name+'" type="'+type+'" value="'+esc(value??'')+'" '+attrs+'></label>';}
function selectField(label,name,value,options){
  return '<label class="form-field"><span>'+esc(label)+'</span><select name="'+name+'">'+options.map(o=>{const [key,caption]=Array.isArray(o)?o:[o,o];return '<option value="'+esc(key)+'" '+(String(value)===String(key)?'selected':'')+'>'+esc(caption)+'</option>';}).join('')+'</select></label>';
}
const CURRENCIES=['USD','EUR','GBP','CAD','AUD','NZD','CHF','JPY','SEK','NOK','DKK','PLN','MXN','BRL','ZAR','INR','AED','MAD'];
function backupsPanel(){
  return '<section class="panel form-panel"><div class="panel-heading"><div><h2>Backups & local data</h2><p>Back up your planner before clearing browser data or switching devices.</p>'+(P.storageNote?'<p id="storage-use"></p>':'')+'</div></div><div class="actions">'+button('Export JSON','export-json',{icon:'download'})+button('Import JSON','import-json')+button('Load sample data','load-sample')+button('Clear all data','clear-data')+'</div></section>';
}
function helpPage(){
  return heading('Help','Field guidance and answers to common questions.')+
    '<section class="panel faq">'+P.help.map(([q,a])=>'<details><summary>'+esc(q)+'</summary><p>'+esc(a)+'</p></details>').join('')+'</section>'+
    '<section class="panel form-panel"><h2>Account, sharing and your data</h2><p>Without an account your records stay in this browser. To sync devices or share with one other person, open Account &amp; sync, create an account with the Access code from your Download &amp; Access PDF and open your workspace. The Workspace code is only used to invite one person. You can delete the cloud workspace or your whole account at any time in Account &amp; sync.</p></section>'+
    '<section class="panel form-panel"><h2>Please note</h2><p>'+esc(P.disclaimer)+'</p></section>';
}
function toast(msg,allowUndo=false){
  const root=document.querySelector('#toast');
  root.innerHTML='<span>'+esc(msg)+'</span>'+(allowUndo?button('Undo','undo'):'')+'<button class="plain square" aria-label="Dismiss notification" data-action="dismiss-toast">'+icon('close',17)+'</button>';
  root.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{root.hidden=true;},allowUndo?15000:4500);
}
function storeDB(){
  try{persisted=atelierCloud?.save(serialize(db)) ?? (localStorage.setItem(DATA_KEY,serialize(db)),true);}
  catch{persisted=false;}
  snapshot=compute();
}
function applyTheme(){
  const s=db.settings;
  document.documentElement.dataset.theme=s.theme==='dark'?'dark':'light';
  document.querySelector('meta[name="theme-color"]').content=s.theme==='dark'?P.darkBg:P.lightBg;
}
function navigate(){mobileNav=false;filter='';order='latest';render();window.scrollTo(0,0);content.focus({preventScroll:true});}
window.addEventListener('hashchange',navigate);
let afterConfirm=null, pendingFile=null, lastFocus=null;
function render(){
  if(!snapshot)snapshot=compute();
  document.querySelector('#atelier-header-status').textContent=atelierCloud?.isActive()?'Shared workspace':'On this device';
  applyTheme();
  const {n,l}=route();
  document.title=l+' · '+P.name;
  document.querySelector('#trail').textContent=l;
  document.querySelector('#sample-flag').hidden=db.edition!=='SAMPLE';
  document.querySelector('#save-warning').hidden=persisted;
  document.body.classList.toggle('nav-open',mobileNav);
  document.querySelector('#mobile-toggle').setAttribute('aria-expanded',String(mobileNav));
  nav.innerHTML=P.groups.map(([group,items])=>'<section><p>'+group+'</p>'+items.map(([name,g,label])=>'<a href="'+linkTo(name)+'" '+(n===name?'aria-current="page"':'')+'>'+icon(g,17)+'<span>'+esc(label)+'</span></a>').join('')+'</section>').join('');
  const views={...P.views,Settings:()=>P.settingsPage()+backupsPanel(),Help:helpPage};
  content.innerHTML=views[n]?views[n]():register(n);
  P.afterRender?.(n);
  if(P.storageNote){const el=document.querySelector('#storage-use');if(el)el.textContent=P.storageNote();}
}
function modal(title,description,body,closable=true){
  lastFocus=document.activeElement;
  dialog.innerHTML='<div class="modal-header"><div><h2 id="modal-title">'+esc(title)+'</h2>'+(description?'<p>'+esc(description)+'</p>':'')+'</div>'+
    (closable?'<button type="button" class="plain square" data-action="close-modal" aria-label="Close dialog">'+icon('close',21)+'</button>':'')+'</div>'+body;
  dialog.dataset.closable=String(closable);
  if(!dialog.open)dialog.showModal();
  dialog.scrollTop=0;
}
dialog.addEventListener('cancel',event=>{if(dialog.dataset.closable==='false')event.preventDefault();});
dialog.addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();});
function confirmModal(title,description,action,label){afterConfirm=action;modal(title,description,'<div class="form-footer">'+button('Cancel','close-modal')+button(label,'confirm',{primary:true})+'</div>');}
function editRow(n,record=null,seed=[]){
  const existing=record?record.values:seed;
  const detail=record?snapshot.rows[n].find(r=>r.id===record.id):null;
  const cells=fields[n].filter(f=>f.type!=='=').map(f=>{
    const value=P.toForm?P.toForm(n,f.label,existing[f.i]??''):(existing[f.i]??''), opts=choices(f.type);
    if(opts.length&&(f.type.includes('/')||['p','q','y'].includes(f.type)))return selectField(f.label,'c'+f.i,value,[['','Choose…'],...opts.map(o=>(f.type==='p'||f.type==='q')?[o,nameOf(o)]:o)]);
    if(P.textareas?.test(f.label))return '<label class="form-field wide"><span>'+esc(f.label)+'</span><textarea name="c'+f.i+'" rows="3" maxlength="2000">'+esc(value)+'</textarea></label>';
    const type={d:'date',t:'datetime-local',h:'time',m:'number',f:'number',n:'number',i:'number',u:'url'}[f.type]??(f.label==='Email'?'email':'text');
    let attrs=f.type==='m'?'step="0.01" inputmode="decimal"':f.type==='f'?'step="0.01" min="0" max="100" inputmode="decimal"':f.type==='i'?'step="1" min="0" inputmode="numeric"':f.type==='n'?'step="any" inputmode="decimal"':
      f.type==='d'?'min="2000-01-01" max="2100-12-31"':f.type==='t'?'min="2000-01-01T00:00" max="2100-12-31T23:59"':'maxlength="200"';
    let extra='';
    const list=P.lists?.(n,f.label)??(P.choiceSets?.[f.type]?P.choiceSets[f.type]():null);
    if(list?.length){attrs+=' list="list-'+f.i+'"';extra='<datalist id="list-'+f.i+'">'+[...new Set(list)].map(item=>'<option value="'+esc(item)+'"></option>').join('')+'</datalist>';}
    return field((P.formLabel?.(n,f.label)??f.label)+(f.type==='f'?' (%)':''),'c'+f.i,f.type==='f'&&filled(value)?Number(value)*100:value,type,attrs)+extra;
  }).join('');
  const calculated=detail?fields[n].filter(f=>f.type==='='&&filled(detail.values[f.i])).map(f=>'<div><dt>'+esc(f.label)+'</dt><dd>'+displayValue(n,f,detail.values[f.i])+'</dd></div>').join(''):'';
  modal(record?'Edit record':'Add record',P.titles?.[n]??n,'<form id="record-form" data-name="'+esc(n)+'" data-id="'+esc(record?.id??'')+'"><div class="form-grid">'+cells+'</div>'+
    (calculated?'<dl class="calculated">'+calculated+'</dl>':'')+'<p id="record-error" class="inline-error" role="alert"></p><div class="form-footer">'+button('Cancel','close-modal')+'<button class="button primary" type="submit">Save record</button></div></form>');
}
function download(name,body,type){
  const url=URL.createObjectURL(new Blob([body],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvEscape(value){let v=String(value??'');if(typeof value==='string'&&/^'*(?:\s*[=+\-@]|[\t\r\n])/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}
function csvExport(n){
  const fs=fields[n].filter(f=>f.type!=='=');
  const header=fs.map(f=>csvEscape(f.label)).join(',');
  const body=db.rows[n].map(r=>fs.map((f,k)=>csvEscape(r.values[k])).join(','));
  download(slug(n)+'.csv','﻿'+[header,...body].join('\r\n'),'text/csv;charset=utf-8');
}
function parseCSV(text){
  const sep=(text.split(/\r?\n/)[0].split(';').length>text.split(/\r?\n/)[0].split(',').length)?';':',';
  const rows=[];let row=[],v='',quoted=false,closed=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){if(c==='"'&&text[i+1]==='"'){v+='"';i++;}else if(c==='"'){quoted=false;closed=true;}else v+=c;}
    else if(c===sep||c==='\n'||c==='\r'){row.push(v);v='';closed=false;if(c!==sep){rows.push(row);row=[];if(c==='\r'&&text[i+1]==='\n')i++;}}
    else if(c==='"'&&!v&&!closed)quoted=true;
    else{if(closed||c==='"')throw Error('Invalid CSV quoting.');v+=c;}
  }
  if(quoted)throw Error('Invalid CSV quoting.');
  if(v||row.length||closed){row.push(v);rows.push(row);}
  return rows;
}
function chooseFile(kind,n){pendingFile={kind,n};const input=document.querySelector('#file');input.accept=kind==='json'?'.json,application/json':'.csv,text/csv';input.value='';input.click();}
document.querySelector('#file').addEventListener('change',async event=>{
  const file=event.target.files[0], pending=pendingFile;
  if(!file||!pending)return;
  try{
    if(file.size>10_000_000)throw Error('Choose a file smaller than 10 MB.');
    const raw=(await file.text()).replace(/^﻿/,'');
    if(pending.kind==='json'){
      const next=normalise(JSON.parse(raw));
      confirmModal('Restore this backup?','The selected backup will replace the data in this planner.',()=>replaceData(next,'Backup restored.'),'Restore backup');
    }else if(P.importCSV&&P.importCSV(pending.n,raw)){/* product-specific import handled */}
    else{
      const n=pending.n, fs=fields[n].filter(f=>f.type!=='=');
      const [head,...lines]=parseCSV(raw);
      const idx=fs.map(f=>head?.findIndex(h=>norm(h)===norm(f.label)));
      if(!head||idx.every(i=>i<0))throw Error('Column headers differ. Start with a CSV exported from '+n+'.');
      const values=lines.filter(r=>r.some(filled)).map((r,j)=>fs.map((f,k)=>{
        const raw=idx[k]<0?'':(r[idx[k]]??'').replace(/^'(?='*(?:\s*[=+\-@]|[\t\r\n]))/,'');
        try{return parseField(raw,f);}catch(e){throw Error('Row '+(j+2)+': '+e.message);}
      }));
      if(!values.length)throw Error('The CSV has no records.');
      confirmModal('Import '+values.length+' records?','The records will be added to '+(P.titles?.[n]??n)+'.',()=>{
        db.rows[n].push(...values.map(v=>({id:id(),values:v})));storeDB();render();toast('Records imported.');
      },'Import records');
    }
  }catch(error){toast(error.message||'Could not open this file.');}
});
function replaceData(next,message){db=next;undo=null;storeDB();render();if(message)toast(message);}
function showWelcome(){
  modal(P.welcome[0],P.welcome[1],
    '<div class="welcome-choices"><button type="button" data-action="welcome-sample">'+icon('star',23)+'<strong>Explore sample data</strong><small>'+esc(P.welcome[2])+'</small></button>'+
    '<button type="button" data-action="welcome-blank">'+icon('note',23)+'<strong>Start blank</strong><small>'+esc(P.welcome[3])+'</small></button><button type="button" id="atelier-welcome-login"><strong>Sign in or create account</strong><small>Open a shared workspace or sync across devices.</small></button></div>',false);
}
document.addEventListener('submit',event=>{
  if(!['record-form','settings-form'].includes(event.target.id))return;
  event.preventDefault();
  const form=event.target, data=Object.fromEntries(new FormData(form));
  if(form.id==='settings-form'){
    try{db=normalise({...db,settings:P.readSettings(data,db.settings)});storeDB();render();toast('Settings saved.');}
    catch(error){document.querySelector('#settings-error').textContent=error.message;}
    return;
  }
  const n=form.dataset.name;
  try{
    const values=fields[n].filter(f=>f.type!=='=').map(f=>{let v=data['c'+f.i];if(P.fromForm&&filled(v))v=P.fromForm(n,f.label,v);return parseField(f.type==='f'&&filled(v)?Number(v)/100:v,f);});
    if(!values.some(filled))throw Error('Enter at least one value.');
    P.validateRow?.(n,values,form.dataset.id);
    const existing=db.rows[n].find(r=>r.id===form.dataset.id);
    if(existing)existing.values=values;else db.rows[n].push({id:id(),values});
    storeDB();dialog.close();render();toast(existing?'Record updated.':'Record added.');
  }catch(error){document.querySelector('#record-error').textContent=error.message;}
});
document.addEventListener('input',event=>{if(event.target.id==='register-search'){filter=event.target.value;refreshRegister(route().n);}});
document.addEventListener('change',event=>{
  if(event.target.id==='view-year'){setPeriod({year:Number(event.target.value),month:activeMonth});render();document.querySelector('#view-year')?.focus();return;}
  if(event.target.id==='register-sort'){order=event.target.value;refreshRegister(route().n);}
  if(event.target.dataset.toggle){
    const n=route().n, t=P.toggles[n], k=fields[n].filter(f=>f.type!=='=').findIndex(f=>f.label===t.label);
    const row=db.rows[n].find(r=>r.id===event.target.dataset.toggle);
    if(row){row.values[k]=event.target.checked?'Yes':'No';t.after?.(row);storeDB();render();}
  }
});
document.addEventListener('click',event=>{
  const currentLink=event.target.closest('.sidebar a');
  if(mobileNav&&currentLink?.hash===location.hash){mobileNav=false;render();return;}
  const el=event.target.closest('[data-action]');
  if(!el)return;
  const action=el.dataset.action, n=el.dataset.name||route().n;
  if(action==='skip-content'){event.preventDefault();content.focus();return;}
  if(action==='toggle-nav'){mobileNav=!mobileNav;render();return;}
  if(action==='close-nav'){mobileNav=false;render();return;}
  if(action==='close-modal'){dialog.close();return;}
  if(action==='dismiss-toast'){document.querySelector('#toast').hidden=true;return;}
  if(action==='confirm'){dialog.close();const fn=afterConfirm;afterConfirm=null;fn?.();return;}
  if(action==='welcome-blank'||action==='welcome-sample'){dialog.close();replaceData(normalise(makeDB(action==='welcome-sample')));return;}
  if(action==='load-sample'||action==='clear-data'){
    confirmModal(action==='load-sample'?'Load the sample data?':'Clear this planner?','This replaces the records and settings currently in this planner.',
      ()=>replaceData(normalise(makeDB(action==='load-sample')),action==='load-sample'?'Sample data loaded.':'Planner cleared.'),action==='load-sample'?'Load sample':'Clear planner');return;
  }
  if(action==='export-json'){download(slug(P.name)+'-backup.json',serialize(db),'application/json');return;}
  if(action==='import-json'){chooseFile('json');return;}
  if(action==='export-csv'){csvExport(n);return;}
  if(action==='import-csv'){chooseFile('csv',n);return;}
  if(action==='print'){window.print();return;}
  if(action==='previous-month'||action==='next-month'){setPeriod(shiftMonth(activeYear,activeMonth,action==='next-month'?1:-1));render();document.querySelector('[data-action="'+action+'"]:not(:disabled)')?.focus();return;}
  if(action==='new-row'){editRow(n);return;}
  if(action==='add'){editRow(el.dataset.name,null,JSON.parse(el.dataset.seed||'[]'));return;}
  if(action==='undo'){if(undo){db.rows[undo.n].splice(undo.i,0,undo.record);if(db.deleted)delete db.deleted[undo.record.id];undo=null;storeDB();render();toast('Record restored.');}return;}
  if(P.actions?.[action]){P.actions[action](el);return;}
  const i=db.rows[n]?.findIndex(r=>r.id===el.dataset.id)??-1;
  if(i<0)return;
  const record=db.rows[n][i];
  if(action==='edit-row'){editRow(n,record);return;}
  if(action==='delete-row'){confirmModal('Delete this record?','You can undo the deletion for 15 seconds.',()=>{db.rows[n].splice(i,1);if(db.deleted)db.deleted[record.id]=Date.now();undo={n,i,record};storeDB();render();toast('Record deleted.',true);},'Delete record');}
});
const cloudPanel=document.querySelector('#atelier-cloud-panel');
document.querySelector('#atelier-cloud-open').addEventListener('click',()=>cloudPanel.showModal());
dialog.addEventListener('click',event=>{if(!event.target.closest('#atelier-welcome-login'))return;dialog.close();cloudPanel.showModal();});
document.querySelector('#atelier-cloud-close').addEventListener('click',()=>cloudPanel.close());
cloudPanel.querySelector('[role=status]').textContent='Connecting to Firebase…';
cloudPanel.querySelector('#atelier-auth').hidden=true;
let atelierCloud;
import('./atelier-cloud.js').then(({installCloud})=>{
  atelierCloud=installCloud({
    key:DATA_KEY,
    read:()=>serialize(db),
    empty:()=>serialize(makeDB()),
    canApply:()=>!dialog.open,
    apply(payload){const next=normalise(JSON.parse(payload));if(dialog.open)dialog.close();undo=null;db=next;snapshot=compute();render();},
    merge:P.merge,
  });
}).catch(()=>{cloudPanel.querySelector('[role=status]').textContent='Firebase could not load. Check your connection and reload this page.';});
snapshot=compute();
render();
if(firstRun)showWelcome();
if(location.protocol==='https:'||(location.protocol==='http:'&&['localhost','127.0.0.1'].includes(location.hostname))){
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  document.addEventListener('click',()=>navigator.storage?.persist?.().catch(()=>{}),{once:true});
}
